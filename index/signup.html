<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription - File d'Attente</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/styles2.css" />
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="images/logo.png" alt="Logo de la mairie" />
            <h1>Créer un compte</h1>
            <p class="subtitle">Accédez à tous nos services en ligne</p>
        </div>

        <div class="card">
            <form id="signupForm" action="signup.php" method="POST" novalidate>

                <!-- Nom complet -->
                <div class="form-group">
                    <label for="name">Nom complet*</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" name="name" placeholder="Jean Dupont" required />
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email*</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="votre@email.com" required />
                    </div>
                </div>

                <!-- Date de naissance -->
                <div class="form-group">
                    <label for="birthdate">Date de naissance*</label>
                    <div class="input-with-icon">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="date" id="birthdate" name="birthdate" required />
                    </div>
                </div>

                <!-- Adresse -->
                <div class="form-group">
                    <label for="address">Adresse*</label>
                    <div class="input-with-icon">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="address" name="address" placeholder="Numéro et rue" required />
                    </div>
                </div>
                <!-- City and Postal Code -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">Ville*</label>
                        <div class="input-with-icon">
                            <i class="fas fa-city"></i>
                            <input type="text" id="city" name="city" placeholder="Paris" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="postal-code">Code postal*</label>
                        <div class="input-with-icon">
                            <i class="fas fa-mail-bulk"></i>
                            <input type="text" id="postal-code" name="postal-code" placeholder="75000" required>
                        </div>
                    </div>
                </div>


                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Mot de passe*</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="passwd" placeholder="••••••••" required>
                        <button type="button" class="show-password" id="togglePassword">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                    <small>Minimum 8 caractères avec chiffres et lettres</small>
                </div>


                <!-- Confirmation mot de passe -->
                <div class="form-group">
                    <label for="confirm-password">Confirmer le mot de passe*</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••"
                            required />
                    </div>
                </div>

                <!-- Conditions d'utilisation -->
                <div class="form-group checkbox-container">
                    <input type="checkbox" id="terms" name="terms" required />
                    <label for="terms">J'accepte les <a href="#">conditions d'utilisation</a> et la <a
                            href="#">politique de confidentialité</a></label>
                </div>

                <!-- Bouton S'inscrire -->
                <button type="submit" class="btn" href="login.html">S'inscrire</button>

                <!-- Lien vers connexion -->
                <div class="login-link">
                    <p>Déjà un compte ? <a href="login.html">Se connecter</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="js/signup-script.js"></script>
</body>

</html>
